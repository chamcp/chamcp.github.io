<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>☀️ 光伏组合 · NEON</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap');

    * { box-sizing: border-box; margin: 0; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #05050a;
      background-image: radial-gradient(ellipse 100% 50% at 50% 0%, rgba(57,255,20,.04) 0, transparent 60%);
      color: #e0e0e0;
      font-family: 'Inter', -apple-system, 'PingFang SC', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .ticker {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 32px;
      background: rgba(57,255,20,.06);
      border-bottom: 1px solid rgba(57,255,20,.15);
      overflow: hidden;
      z-index: 100;
      backdrop-filter: blur(20px);
    }
    .ticker-inner {
      display: flex;
      align-items: center;
      height: 100%;
      white-space: nowrap;
      animation: ticker-scroll 24s linear infinite;
    }
    @keyframes ticker-scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .ticker-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 24px;
      font-size: 12px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .5px;
    }
    .ticker-item .dot-neon {
      width: 5px; height: 5px;
      border-radius: 50%;
      display: inline-block;
    }
    .ticker-item .dot-neon.up { background: #ff4757; box-shadow: 0 0 6px #ff4757; }
    .ticker-item .dot-neon.down { background: #39FF14; box-shadow: 0 0 6px #39FF14; }

    .app {
      max-width: 600px;
      margin: 0 auto;
      padding: 48px 16px 40px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -.5px;
      background: linear-gradient(135deg, #fff 30%, #39FF14 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .live-neon {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #39FF14;
    }
    .live-neon .pulse-ring {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #39FF14;
      box-shadow: 0 0 8px #39FF14, 0 0 16px rgba(57,255,20,.4);
      animation: pulse-ring 2s ease-in-out infinite;
    }
    @keyframes pulse-ring {
      0%,100% { box-shadow: 0 0 8px #39FF14, 0 0 16px rgba(57,255,20,.4); }
      50% { box-shadow: 0 0 12px #39FF14, 0 0 24px rgba(57,255,20,.6), 0 0 40px rgba(57,255,20,.2); }
    }

    .sub {
      color: rgba(255,255,255,.25);
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .kpi-card {
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(57,255,20,.12);
      border-radius: 10px;
      padding: 14px 8px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #39FF14, transparent);
      opacity: .5;
    }
    .kpi-card .label {
      display: block;
      color: rgba(255,255,255,.3);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .kpi-card .value {
      display: block;
      font-size: 18px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -.3px;
    }
    .kpi-card .value.is-up { color: #ff4757; }
    .kpi-card .value.is-down { color: #39FF14; }

    .cards { display: flex; flex-direction: column; gap: 10px; }

    .card {
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.06);
      border-radius: 14px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      transition: border-color .3s, box-shadow .3s;
    }
    .card:hover {
      border-color: rgba(57,255,20,.2);
      box-shadow: 0 0 30px rgba(57,255,20,.04);
    }
    .card.no-holding { opacity: .4; }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-name {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-name .mood {
      font-size: 22px;
      line-height: 1;
      filter: drop-shadow(0 0 4px rgba(255,255,255,.2));
    }
    .card-name h2 {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -.3px;
      color: #f0f4ff;
    }
    .card-name code {
      display: block;
      color: rgba(255,255,255,.2);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .5px;
      margin-top: 1px;
    }
    .card-right {
      text-align: right;
    }
    .card-right .price {
      font-size: 24px;
      font-weight: 900;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: -.5px;
    }
    .card-right .price.is-up { color: #ff4757; text-shadow: 0 0 12px rgba(255,71,87,.3); }
    .card-right .price.is-down { color: #39FF14; text-shadow: 0 0 12px rgba(57,255,20,.3); }
    .change-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: .3px;
      margin-top: 2px;
    }
    .change-badge.is-up { background: rgba(255,71,87,.12); color: #ff4757; }
    .change-badge.is-down { background: rgba(57,255,20,.12); color: #39FF14; }

    .card-pl {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.04);
    }
    .pl-item { text-align: center; }
    .pl-item .label {
      display: block;
      color: rgba(255,255,255,.25);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .pl-item .value {
      font-size: 13px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      margin-top: 3px;
    }
    .pl-item .value.is-up { color: #ff4757; }
    .pl-item .value.is-down { color: #39FF14; }

    .chart-wrap {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,.04);
    }
    .chart-range {
      position: relative;
      height: 28px;
    }
    .chart-track {
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 1px;
      background: rgba(255,255,255,.06);
      transform: translateY(-50%);
    }
    .chart-body {
      position: absolute;
      top: 4px;
      bottom: 4px;
      border-radius: 2px;
      transition: all .3s;
    }
    .chart-dot {
      position: absolute;
      top: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 1;
    }
    .chart-dot.open {
      width: 5px; height: 5px;
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.2);
    }
    .chart-dot.cur {
      width: 14px; height: 14px;
      border: 3px solid;
      box-shadow: 0 0 20px;
    }
    .chart-dot.cur.is-up { background: #ff4757; border-color: #ff4757; box-shadow: 0 0 20px rgba(255,71,87,.4); }
    .chart-dot.cur.is-down { background: #39FF14; border-color: #39FF14; box-shadow: 0 0 20px rgba(57,255,20,.4); }
    .chart-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }
    .chart-labels .tag {
      text-align: center;
      font-size: 9px;
      color: rgba(255,255,255,.2);
      font-weight: 600;
      letter-spacing: .5px;
    }
    .chart-labels .tag .v {
      font-size: 12px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: rgba(255,255,255,.5);
      margin-top: 1px;
    }
    .chart-labels .tag .v.is-up { color: #ff4757; }
    .chart-labels .tag .v.is-down { color: #39FF14; }
    .chart-foot {
      display: flex;
      justify-content: space-between;
      margin-top: 4px;
      font-size: 10px;
      color: rgba(255,255,255,.15);
      font-weight: 600;
    }
    .chart-foot .hl { font-weight: 700; font-size: 11px; font-family: 'JetBrains Mono', monospace; }

    .note {
      margin-top: 24px;
      color: rgba(255,255,255,.12);
      font-size: 10px;
      text-align: center;
      letter-spacing: .5px;
    }

    @media (max-width: 420px) {
      .app { padding: 44px 12px 32px; }
      .header h1 { font-size: 21px; }
      .kpi-row { gap: 6px; }
      .kpi-card .value { font-size: 15px; }
      .card-right .price { font-size: 20px; }
      .card-pl { grid-template-columns: 1fr 1fr; gap: 8px; }
    }
  </style>
</head>
<body>
  <div class="ticker" id="tickerBar">
    <div class="ticker-inner" id="tickerInner"></div>
  </div>

  <div class="app">
    <div class="header">
      <h1>☀️ 光伏组合</h1>
      <div class="live-neon">
        <span class="pulse-ring"></span>
        LIVE
      </div>
    </div>
    <p class="sub">金刚光伏 · 聚和材料 · 迈为股份</p>

    <div class="kpi-row">
      <div class="kpi-card">
        <span class="label">持仓市值</span>
        <span class="value" id="totalValue">-</span>
      </div>
      <div class="kpi-card">
        <span class="label">总盈亏</span>
        <span class="value" id="totalPL">-</span>
      </div>
      <div class="kpi-card">
        <span class="label">收益率</span>
        <span class="value" id="totalReturn">-</span>
      </div>
    </div>

    <div class="cards" id="stockCards"></div>
    <p class="note" id="updateNote"></p>
  </div>

  <script src="./data.js"></script>
  <script>
    const HOLDINGS = { sz300093: { shares: 16900, cost: 18.09 } };
    const MOODS = {
      surge:  { emoji: '🚀', text: '强势拉升' },
      up:     { emoji: '📈', text: '稳步上涨' },
      slight: { emoji: '↗️', text: '小幅走高' },
      flat:   { emoji: '😴', text: '横盘震荡' },
      down:   { emoji: '📉', text: '小幅回调' },
      plunge: { emoji: '💧', text: '深度调整' },
    };
    function getMood(pct) {
      if (pct >= 5) return MOODS.surge;
      if (pct >= 2) return MOODS.up;
      if (pct > 0) return MOODS.slight;
      if (pct === 0) return MOODS.flat;
      if (pct > -3) return MOODS.down;
      return MOODS.plunge;
    }
    function fmt(n) { return n.toFixed(2); }
    function arrow(v) {
      if (v > 0) return '▲';
      if (v < 0) return '▼';
      return '—';
    }

    function buildTicker(stocks) {
      const items = stocks.map(s => {
        const cls = s.change >= 0 ? 'up' : 'down';
        const sign = s.change >= 0 ? '+' : '';
        return `<span class="ticker-item"><span class="dot-neon ${cls}"></span>${s.name} <span style="color:${s.change >= 0 ? '#ff4757' : '#39FF14'}">${sign}${s.changePct}%</span></span>`;
      });
      const html = items.join('') + items.join('');
      document.getElementById('tickerInner').innerHTML = html;
    }

    function render() {
      const data = window.STOCK_DATA;
      if (!data || !data.stocks) {
        document.getElementById('stockCards').innerHTML =
          '<p style="color:rgba(255,255,255,.2);padding:40px;text-align:center;font-weight:600">⏳ LOADING</p>';
        return;
      }
      const stocks = data.stocks;
      buildTicker(stocks);

      let totalValue = 0, totalCost = 0, totalPL = 0;

      document.getElementById('stockCards').innerHTML = stocks.map(s => {
        const holding = HOLDINGS[s.code];
        const hasHolding = !!holding;
        const costTotal = hasHolding ? holding.shares * holding.cost : 0;
        const marketValue = hasHolding ? holding.shares * s.price : 0;
        const pl = marketValue - costTotal;
        const plPct = costTotal > 0 ? (pl / costTotal) * 100 : 0;
        const mood = getMood(s.changePct);
        if (hasHolding) { totalValue += marketValue; totalCost += costTotal; totalPL += pl; }

        const cls = s.change >= 0 ? 'is-up' : 'is-down';
        const plCls = pl >= 0 ? 'is-up' : 'is-down';
        const cardCls = hasHolding ? '' : 'no-holding';
        const range = s.high - s.low;

        return `
          <div class="card ${cardCls}">
            <div class="card-top">
              <div class="card-name">
                <span class="mood">${mood.emoji}</span>
                <div>
                  <h2>${s.name}</h2>
                  <code>${s.code.toUpperCase()} · ${mood.text}</code>
                </div>
              </div>
              <div class="card-right">
                <div class="price ${cls}">${fmt(s.price)}</div>
                <span class="change-badge ${cls}">${arrow(s.change)} ${s.change >= 0 ? '+' : ''}${s.changePct}%</span>
              </div>
            </div>
            ${hasHolding ? `
            <div class="card-pl">
              <div class="pl-item">
                <span class="label">持仓</span>
                <span class="value">${(holding.shares / 10000).toFixed(2)}万</span>
              </div>
              <div class="pl-item">
                <span class="label">成本</span>
                <span class="value">${fmt(holding.cost)}</span>
              </div>
              <div class="pl-item">
                <span class="label">盈亏</span>
                <span class="value ${plCls}">${pl >= 0 ? '+' : ''}${fmt(pl)}</span>
              </div>
              <div class="pl-item">
                <span class="label">收益率</span>
                <span class="value ${plCls}">${plPct >= 0 ? '+' : ''}${plPct.toFixed(1)}%</span>
              </div>
            </div>` : `
            <div class="card-pl" style="grid-template-columns:1fr;padding:8px 0">
              <div class="pl-item">
                <span class="label">未记录持仓 · 点击编辑</span>
              </div>
            </div>`}
            <div class="chart-wrap">
              <div class="chart-range">
                <div class="chart-track"></div>
                <div class="chart-body" style="left:${((Math.min(s.open, s.price) - s.low) / range) * 100}%;width:${(Math.abs(s.price - s.open) / range) * 100}%;background:${s.change >= 0 ? '#ff4757' : '#39FF14'}"></div>
                <div class="chart-dot open" style="left:${((s.open - s.low) / range) * 100}%"></div>
                <div class="chart-dot cur ${cls}" style="left:${((s.price - s.low) / range) * 100}%"></div>
              </div>
              <div class="chart-labels">
                <div class="tag" style="text-align:left">低<div class="v">${fmt(s.low)}</div></div>
                <div class="tag" style="text-align:center">开<div class="v">${fmt(s.open)}</div></div>
                <div class="tag" style="text-align:center">现<div class="v ${cls}">${fmt(s.price)}</div></div>
                <div class="tag" style="text-align:right">高<div class="v">${fmt(s.high)}</div></div>
              </div>
              <div class="chart-foot">
                <span>昨收 ${fmt(s.prevClose)}</span>
                <span class="hl ${cls}">振幅 ${((s.high - s.low) / s.prevClose * 100).toFixed(2)}%</span>
              </div>
            </div>
          </div>`;
      }).join('');

      document.getElementById('totalValue').textContent = fmt(totalValue);
      const plEl = document.getElementById('totalPL');
      plEl.textContent = (totalPL >= 0 ? '+' : '') + fmt(totalPL);
      plEl.className = totalPL >= 0 ? 'is-up value' : 'is-down value';
      const rEl = document.getElementById('totalReturn');
      const totalReturnPct = totalCost > 0 ? (totalPL / totalCost) * 100 : 0;
      rEl.textContent = (totalReturnPct >= 0 ? '+' : '') + totalReturnPct.toFixed(1) + '%';
      rEl.className = totalReturnPct >= 0 ? 'is-up value' : 'is-down value';

      document.getElementById('updateNote').textContent =
        `⏺ ${data.meta.source} · ${data.meta.updatedAt}`;
    }
    render();

    let sec = 60;
    const refreshEl = document.getElementById('updateNote');
    setInterval(() => {
      sec--;
      if (sec <= 0) { location.reload(); }
      refreshEl.textContent = `⏺ 新浪财经 · ${sec}s 后自动刷新`;
    }, 1000);
  </script>
</body>
</html>
